server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlasshard}
    username: ${SPRING_DATASOURCE_USERNAME:atlasshard}
    password: ${SPRING_DATASOURCE_PASSWORD:atlasshard-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  kafka:
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: atlasshard-workers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${APP_REDIS_HOST:localhost}
      port: ${APP_REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
app:
  jwt-secret: ${APP_JWT_SECRET:change-this-local-secret-before-public-deployment-please}
  cors-origin: ${APP_CORS_ORIGIN:http://localhost:5174}
  cookie-secure: ${APP_COOKIE_SECURE:false}
  s3:
    endpoint: ${APP_S3_ENDPOINT:http://localhost:9000}
    region: ${APP_S3_REGION:us-east-1}
    bucket: ${APP_S3_BUCKET:atlasshard-objects}
    access-key: ${APP_S3_ACCESS_KEY:atlasshard}
    secret-key: ${APP_S3_SECRET_KEY:atlasshard-local-secret}
  upload-temp: ${APP_UPLOAD_TEMP:/tmp/atlasshard}
